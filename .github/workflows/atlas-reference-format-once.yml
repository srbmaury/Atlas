name: Format Atlas reference redesign (temporary)
on:
  push:
    branches: [design/mui-tailwind-frontend]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run format
        working-directory: frontend
      - name: Commit formatted UI
        run: |
          if ! git diff --quiet -- frontend; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend
            git commit -m "style(frontend): format reference dashboard redesign"
            git push origin HEAD:${{ github.ref_name }}
          fi
