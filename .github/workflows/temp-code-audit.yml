name: Temporary code audit
on:
  push:
    branches: [design/mui-tailwind-frontend]
    paths: [.github/workflows/temp-code-audit.yml]
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan PR and main code
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, subprocess, collections, pathlib
          def content_at(ref,path):
              if ref=='HEAD': return pathlib.Path(path).read_text(errors='replace')
              p=subprocess.run(['git','show',f'{ref}:{path}'],capture_output=True,text=True)
              return p.stdout if p.returncode==0 else ''
          def paths_at(ref):
              return subprocess.check_output(['git','ls-tree','-r','--name-only',ref],text=True).splitlines()
          for ref in ['origin/main','HEAD']:
              paths=paths_at(ref)
              scripts={p:content_at(ref,p) for p in paths if p.startswith('frontend/') and p.endswith(('.ts','.tsx','.js','.jsx','.mjs')) and '/public/debugger/' not in p}
              css={p:content_at(ref,p) for p in paths if p.startswith('frontend/') and p.endswith('.css')}
              allscript='\n'.join(scripts.values())
              print('=== SCAN',ref,'files',len(scripts),'css',len(css),'===')
              for p,s in css.items():
                  classnames=set(re.findall(r'\.((?:atlas-ref|sidebar|workspace|research|source|composer|home|document|agent|integration)[a-zA-Z0-9_-]*)',s))
                  unused=sorted(n for n in classnames if not re.search(r'(?<![\w-])'+re.escape(n)+r'(?![\w-])',allscript))
                  selectors=[x.strip() for x in re.findall(r'(?:^|\})\s*([^{}]+?)\s*\{',s,re.M) if not x.lstrip().startswith('@')]
                  counts=collections.Counter(x for x in selectors if not x.startswith('/*'))
                  duplicate=[(x,n) for x,n in counts.items() if n>=2]
                  if (len(unused)>3 or len(duplicate)>2) and len(s)>4000:
                      print('CSS',p,'unused_candidates',len(unused),unused[:25],'duplicate_selectors',duplicate[:15])
              exports=[]
              for p,s in scripts.items():
                  if p.endswith(('.ts','.tsx')):
                      for m in re.finditer(r'export\s+(?:async\s+)?(?:function|const|class|type|interface)\s+(\w+)',s):
                          name=m.group(1)
                          if name not in ('default','metadata','GET','POST','PUT','PATCH','DELETE'):
                              refs=sum(len(re.findall(r'\b'+re.escape(name)+r'\b',v)) for q,v in scripts.items() if q!=p)
                              if refs==0:
                                  exports.append((p,name))
              print('POSSIBLE_UNREFERENCED_EXPORTS',exports[:80])
              comments=[]
              for p,s in scripts.items():
                  if p.endswith(('.ts','.tsx','.js','.jsx')):
                      for i,l in enumerate(s.splitlines(),1):
                          if re.match(r'\s*//\s*(?:TODO|FIXME|Legacy|Old|Temporary|Keep|Avoid|Deprecated)',l,re.I):
                              comments.append((p,i,l.strip()[:100]))
              print('CODE_COMMENTS_REVIEW',comments[:90])
          PY
