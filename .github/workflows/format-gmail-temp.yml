name: Temporary Gmail feature formatting
on:
  push:
    branches: [feat/gmail-intelligence]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gmail-intelligence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format frontend
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write components/sources/gmail/GmailWorkspaceView.tsx utils/conversationActions.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format Python files
        run: |
          pip install ruff
          ruff check --fix backend/app/connected_research.py backend/app/gmail.py backend/tests/test_evidence_quality.py backend/tests/test_gmail_threads.py backend/tests/test_gmail_connected_search.py backend/tests/test_gmail_query_intent.py backend/app/evidence_quality.py backend/app/research_queries.py backend/app/schemas.py
          ruff format backend/app/connected_research.py backend/app/gmail.py backend/tests/test_evidence_quality.py backend/tests/test_gmail_threads.py backend/tests/test_gmail_connected_search.py backend/tests/test_gmail_query_intent.py backend/app/evidence_quality.py backend/app/research_queries.py backend/app/schemas.py
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/components/sources/gmail/GmailWorkspaceView.tsx frontend/utils/conversationActions.ts backend/app/connected_research.py backend/app/gmail.py backend/tests/test_evidence_quality.py backend/tests/test_gmail_threads.py backend/tests/test_gmail_connected_search.py backend/tests/test_gmail_query_intent.py backend/app/evidence_quality.py backend/app/research_queries.py backend/app/schemas.py
            git commit -m "style: format Gmail intelligence changes"
            git push origin HEAD:feat/gmail-intelligence
          fi
