name: Targeted research UX browser review
on:
  push:
    branches: [design/mui-tailwind-frontend]
permissions:
  contents: read
jobs:
  research-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install test runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Review research UX
        working-directory: frontend
        run: npx playwright test e2e/reference-dashboard.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-ux-review
          path: frontend/test-results
          retention-days: 2
