name: Format Deep Research branch
on:
  push:
    branches: [feat/deep-research-progress]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deep-research-progress
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format
        working-directory: frontend
      - name: Format Python
        run: |
          python -m pip install ruff
          ruff check --fix backend/app/main.py backend/app/routes/deep_research.py
          ruff format backend/app/main.py backend/app/routes/deep_research.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend/app/main.py backend/app/routes/deep_research.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format Deep Research frontend"
            git push origin HEAD:feat/deep-research-progress
          fi
