name: Temporary composer format check
on:
  push:
    branches: [design/mui-tailwind-frontend]
    paths: [.github/workflows/temp-composer-format.yml]
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Format and print shared composer files
        working-directory: frontend
        shell: bash
        run: |
          npx prettier --write components/chat/ResearchQuestionBox.tsx components/chat/ResearchComposer.tsx components/chat/ResearchWorkspace.tsx components/home/HomeView.tsx e2e/reference-dashboard.spec.ts
          echo -n 'FORMATTED_QUESTION_BOX='; base64 -w0 components/chat/ResearchQuestionBox.tsx; echo
          echo -n 'FORMATTED_CHAT_COMPOSER='; base64 -w0 components/chat/ResearchComposer.tsx; echo
          echo -n 'FORMATTED_CHAT_WORKSPACE='; base64 -w0 components/chat/ResearchWorkspace.tsx; echo
          echo -n 'FORMATTED_HOME='; base64 -w0 components/home/HomeView.tsx; echo
          echo -n 'FORMATTED_TEST='; base64 -w0 e2e/reference-dashboard.spec.ts; echo
          npm run typecheck
