name: One-time formatting repair
on:
  push:
    branches: [feat/chat-management-agent-roadmap]
    paths: [.github/workflows/format-repair.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-management-agent-roadmap
      - uses: astral-sh/setup-uv@v6
      - name: Format Python
        run: uvx ruff format backend evals ops load_tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format frontend
        working-directory: frontend
        run: |
          npm ci
          npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend evals ops load_tests frontend
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff and Prettier formatting [skip ci]"
            git push origin HEAD:feat/chat-management-agent-roadmap
          fi
