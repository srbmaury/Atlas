name: Atlas checks
on:
    pull_request:
    push:
        branches: [main]
jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            - name: Install backend
              run: pip install -r backend/requirements-dev.txt
            - name: Verify pinned production dependencies
              run: |
                  pip install -r backend/requirements.lock
                  pip check
            - name: Check Python style
              run: |
                  ruff check backend evals ops load_tests
                  ruff format --check backend evals ops load_tests
            - name: Run API tests
              env:
                  PYTHONPATH: backend
              run: pytest backend/tests -q
    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install frontend
              working-directory: frontend
              run: npm ci
            - name: Check frontend formatting
              working-directory: frontend
              run: npm run format:check
            - name: Conversation unit tests
              working-directory: frontend
              run: node --experimental-strip-types --test tests/*.test.mjs
            - name: Typecheck
              working-directory: frontend
              run: npm run typecheck
            - name: Build
              working-directory: frontend
              run: npm run build

    e2e:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install frontend
              working-directory: frontend
              run: npm ci
            - name: Install browser test runner
              working-directory: frontend
              run: npm install --no-save --package-lock=false @playwright/test@1.56.1
            - name: Install Chromium
              working-directory: frontend
              run: npx playwright install --with-deps chromium
            - name: Run interaction tests
              working-directory: frontend
              run: npx playwright test

    docker-smoke:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Build backend image
              run: docker build -f backend/Dockerfile -t atlas-backend-test .
            - name: Apply migrations inside image
              run: docker run --rm -e DATABASE_URL=sqlite:////tmp/atlas-test.db -e DATA_DIR=/tmp atlas-backend-test python -c "from app.db import init_db; init_db()"

    postgres-rbac:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: atlas_test
                    POSTGRES_PASSWORD: atlas_test
                    POSTGRES_DB: atlas_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U atlas_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            - name: Install backend
              run: pip install -r backend/requirements-dev.txt
            - name: Verify PostgreSQL access boundaries and migrations
              env:
                  PYTHONPATH: backend
                  ATLAS_TEST_DATABASE_URL: postgresql+psycopg://atlas_test:atlas_test@127.0.0.1:5432/atlas_test
              run: pytest backend/tests/test_rbac.py -q
