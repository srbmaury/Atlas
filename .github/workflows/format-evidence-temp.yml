name: Temporary evidence follow-up formatting
on:
  push:
    branches: [feat/gmail-intelligence]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gmail-intelligence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format frontend
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write utils/evidenceFollowups.ts utils/conversationActions.ts e2e/research.spec.ts lib/types.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/utils/evidenceFollowups.ts frontend/utils/conversationActions.ts frontend/e2e/research.spec.ts frontend/lib/types.ts
            git commit -m "style: format source-agnostic evidence follow-ups"
            git push origin HEAD:feat/gmail-intelligence
          fi
