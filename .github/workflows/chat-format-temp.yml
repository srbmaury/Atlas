name: Temporary frontend format
on:
  push:
    branches: [feat/chat-management-agent-roadmap]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-management-agent-roadmap
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm ci && npx prettier --write app/styles/workspace-layout.css components/AtlasWorkspace.tsx components/chat/ConversationHistory.tsx e2e/research.spec.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend
            git commit -m "style: format chat UX changes"
            git push origin HEAD:feat/chat-management-agent-roadmap
          fi
