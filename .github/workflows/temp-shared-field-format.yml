name: Temporary shared field formatting
on:
  push:
    branches: [design/mui-tailwind-frontend]
    paths: [.github/workflows/temp-shared-field-format.yml]
jobs:
  format:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Format and verify
        working-directory: frontend
        shell: bash
        run: |
          npx prettier --write components/chat/ResearchQuestionBox.tsx components/chat/ResearchComposer.tsx components/home/HomeView.tsx
          echo -n 'FORMATTED_FIELD='; base64 -w0 components/chat/ResearchQuestionBox.tsx; echo
          echo -n 'FORMATTED_CHAT='; base64 -w0 components/chat/ResearchComposer.tsx; echo
          echo -n 'FORMATTED_HOME='; base64 -w0 components/home/HomeView.tsx; echo
          npm run typecheck
