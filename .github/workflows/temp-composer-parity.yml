name: Temporary composer visual parity
on:
  push:
    branches: [design/mui-tailwind-frontend]
    paths: [.github/workflows/temp-composer-parity.yml]
jobs:
  compare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: frontend
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test e2e/reference-dashboard.spec.ts --workers=1
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composer-visual-parity
          path: frontend/test-results
          retention-days: 1
