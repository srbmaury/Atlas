name: Synchronize frontend lockfile during MUI migration

on:
    push:
        branches: [design/mui-tailwind-frontend]

permissions:
    contents: write

jobs:
    update-lockfile:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: true
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - name: Resolve frontend dependencies
              working-directory: frontend
              run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            - name: Commit lockfile if changed
              run: |
                  if ! git diff --quiet -- frontend/package-lock.json; then
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add frontend/package-lock.json
                    git commit -m "chore(frontend): synchronize MUI and Tailwind lockfile"
                    git push origin HEAD:${{ github.ref_name }}
                  fi
